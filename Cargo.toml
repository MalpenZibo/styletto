[package]
name = "styletto"
description = "A design system for Guido: tokens, themes and components"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[workspace]
resolver = "3"
members = ["storybook"]

[workspace.package]
repository = "https://github.com/MalpenZibo/styletto"
authors = ["Simone Camito (Zibo)"]
license = "MIT"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
guido = "0.13.0"
log = "0.4.35"

[dependencies]
guido.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
log = { workspace = true, optional = true }
material-colors = { version = "0.5.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
# `[appearance]` read from a config file: UiConfig and Deserialize on the
# choices it holds.
serde = ["dep:serde", "dep:log"]
# Themes worked out from a seed colour.
material = ["dep:material-colors"]
# ...or from a wallpaper.
wallpaper = ["material", "material-colors/quantize", "dep:image"]

[dev-dependencies]
toml = "1.2.1"
