[package]
name = "styletto"
description = "A design system for Guido: tokens, themes and components"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[workspace]
resolver = "3"
members = ["storybook"]

[workspace.package]
repository = "https://github.com/MalpenZibo/styletto"
authors = ["Simone Camito (Zibo)"]
license = "MIT"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
# Temporarily on main, for a change not yet released; back to a version once it is.
guido = { git = "https://github.com/MalpenZibo/guido", branch = "main" }
log = "0.4.35"

[dependencies]
guido.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
log = { workspace = true, optional = true }
material-colors = { version = "0.5.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
# `[appearance]` read from a config file and written back: UiConfig, and
# Deserialize and Serialize on the choices it holds.
serde = ["dep:serde", "dep:log"]
# Themes worked out from a seed colour.
material = ["dep:material-colors"]
# ...or from a wallpaper, read once per path on a thread of its own.
wallpaper = ["material", "material-colors/quantize", "dep:image", "dep:log"]

[dev-dependencies]
# `testing` for the tests that mount a tree headless.
guido = { workspace = true, features = ["testing"] }
toml = "1.2.1"
